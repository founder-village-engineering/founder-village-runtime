name: Promote prepared release
on:
  workflow_dispatch:
    inputs:
      environment:
        { type: choice, options: [staging, production], required: true }
      release:
        {
          description: "Prepared 64-character release fingerprint",
          type: string,
          required: true,
        }
permissions: { contents: read }
concurrency:
  { group: "deploy-${{ inputs.environment }}", cancel-in-progress: false }
jobs:
  promote:
    runs-on: [self-hosted, fv-deploy]
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      # The dedicated trusted runner is already installed; never run untrusted PR code here.
      - name: Promote exact artifact
        env:
          FV_DEPLOY_ENV: ${{ inputs.environment }}
          FV_RELEASE_ID: ${{ inputs.release }}
        run: |
          [[ "$FV_RELEASE_ID" =~ ^[a-f0-9]{64}$ ]]
          [[ "$FV_DEPLOY_ENV" == staging || "$FV_DEPLOY_ENV" == production ]]
          /opt/founder-village/target/release/fv --root /opt/founder-village --config "config/$FV_DEPLOY_ENV.private.json" release deploy --id "$FV_RELEASE_ID"
