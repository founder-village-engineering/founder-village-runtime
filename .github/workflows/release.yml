name: Build signed release
on:
  push: { tags: ["v*.*.*"] }
permissions: { contents: read }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      FV_ARCH: ${{ matrix.arch }}
      IMAGE_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.22.0, cache: npm }
      - run: npm ci
      - run: rustup toolchain install 1.90.0 --profile minimal && cargo build --release --locked -p fv-cli
      - name: Build and exercise native artifacts
        run: |
          set -euo pipefail
          docker buildx build --platform "linux/$FV_ARCH" --load --provenance=false --build-arg FV_REVISION="$GITHUB_SHA" \
            -f infra/images/app.Dockerfile -t fv-runtime:local .
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' fv-runtime:local)" == "linux/$FV_ARCH" ]]
          ./target/release/fv up
          node scripts/smoke-containers.ts
      - uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: fv-runtime:local
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload scanned image by digest
        env: { GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$IMAGE_REPO:$GITHUB_SHA-$FV_ARCH"
          docker tag fv-runtime:local "$tag"
          docker push "$tag"
          docker image inspect --format '{{index .RepoDigests 0}}' "$tag" > platform-image.txt
          install -m 0755 target/release/fv fv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.arch }}
          path: |
            fv
            platform-image.txt
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 1
  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write }
    timeout-minutes: 15
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.22.0 }
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          { pattern: "native-*", path: "${{ runner.temp }}/fv-release/parts" }
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
      - name: Bind and sign the exact multi-platform release
        env: { GHCR_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          release_dir="$RUNNER_TEMP/fv-release"
          parts="$release_dir/parts"
          amd=$(cat "$parts/native-amd64/platform-image.txt")
          arm=$(cat "$parts/native-arm64/platform-image.txt")
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE_REPO:$GITHUB_SHA" \
            --metadata-file "$parts/index.json" "$amd" "$arm"
          digest=$(jq -er '."containerimage.descriptor".digest' "$parts/index.json")
          printf '%s@%s\n' "$IMAGE_REPO" "$digest" > image-digest.txt
          node scripts/check-image-platforms.ts "$(cat image-digest.txt)" "$amd" "$arm"
          cosign sign --yes "$(cat image-digest.txt)"
          git archive --format=tar --output=source.tar "$GITHUB_SHA"
          node scripts/release-manifest.ts "$parts"
          cosign sign-blob --yes --bundle source.sigstore.json source.tar
          cosign sign-blob --yes --bundle source-manifest.sigstore.json source-manifest.json
          for arch in amd64 arm64; do
            bundle="$release_dir/$arch"
            mkdir -p "$bundle"
            cp "$parts/native-$arch/"{fv,sbom.cdx.json} "$bundle/"
            cp source.tar source.sigstore.json source-manifest.json source-manifest.sigstore.json image-digest.txt "$bundle/"
            cosign sign-blob --yes --bundle "$bundle/fv.sigstore.json" "$bundle/fv"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fv-linux-amd64-${{ github.sha }}
          path: "${{ runner.temp }}/fv-release/amd64/*"
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fv-linux-arm64-${{ github.sha }}
          path: "${{ runner.temp }}/fv-release/arm64/*"
          if-no-files-found: error
