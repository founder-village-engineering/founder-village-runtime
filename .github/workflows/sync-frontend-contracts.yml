name: Synchronize frontend contracts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-frontend-contracts.yml
      - config/applications.json
      - config/frontends.json
      - packages/frontend-contracts/**
      - scripts/sync-frontend-contracts.ts
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: frontend-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: founder-village-engineering/founder-village-frontends
          path: frontends
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          {
            node-version: 24.22.3,
            cache: npm,
            cache-dependency-path: runtime/package-lock.json,
          }
      - run: npm ci
        working-directory: runtime
      - name: Copy canonical contracts
        working-directory: runtime
        run: npm run frontend-contracts:sync -- --frontends-root ../frontends
      - name: Verify generated snapshots
        working-directory: frontends
        run: npm ci && npm run contracts:check
      - name: Open or update the generated-contract pull request
        working-directory: frontends
        env:
          GH_TOKEN: ${{ secrets.FOUNDER_VILLAGE_FRONTENDS_SYNC_TOKEN }}
          RUNTIME_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$(git status --porcelain -- 'apps/*/src/generated/contracts')" ]]; then
            echo "Frontend contracts already match runtime $RUNTIME_SHA"
            exit 0
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure FOUNDER_VILLAGE_FRONTENDS_SYNC_TOKEN to publish updated generated contracts."
            exit 1
          fi
          BRANCH="automation/runtime-contracts-${RUNTIME_SHA::12}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Contract branch already exists for runtime $RUNTIME_SHA"
            gh pr view "$BRANCH" \
              --repo founder-village-engineering/founder-village-frontends >/dev/null || \
              gh pr create \
                --repo founder-village-engineering/founder-village-frontends \
                --base main \
                --head "$BRANCH" \
                --title "Sync runtime frontend contracts" \
                --body "Generated from founder-village-runtime commit $RUNTIME_SHA."
            exit 0
          fi
          git config user.name "founder-village-contracts[bot]"
          git config user.email "founder-village-contracts[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add apps/*/src/generated/contracts
          git commit -m "Sync runtime frontend contracts"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo founder-village-engineering/founder-village-frontends \
            --base main \
            --head "$BRANCH" \
            --title "Sync runtime frontend contracts" \
            --body "Generated from founder-village-runtime commit $RUNTIME_SHA."
