name: Verify runtime
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}
permissions: { contents: read }
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24.22.0, cache: npm }
      - name: Scan source and Git history for secrets
        shell: bash
        run: |
          scan_tools="$(mktemp -d "$RUNNER_TEMP/fv-scan.XXXXXX")"
          archive="$scan_tools/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" \
            | sha256sum --check --status
          tar -xzf "$archive" -C "$scan_tools" gitleaks
          export PATH="$scan_tools:$PATH"
          npm run security:scan
          npm run security:scan -- --history
      - run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - run: npm ci
      - run: npm run format:check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: rustup toolchain install 1.97.0 --profile minimal && cargo +1.97.0 install cargo-audit --version 0.23.0 --locked
      - run: cargo audit
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/check-image-platforms.ts
      - run: cargo build --locked -p fv-cli
      - run: ./target/debug/fv init && ./target/debug/fv up
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Verify compiled application containers
        run: |
          docker build -f infra/images/app.Dockerfile -t fv-runtime:local .
          node scripts/smoke-containers.ts
      - run: ./target/debug/fv backup capture && ./target/debug/fv backup restore-drill
      - if: ${{ always() && hashFiles('target/debug/fv') != '' }}
        run: ./target/debug/fv down
